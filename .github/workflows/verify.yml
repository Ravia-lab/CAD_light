# Typprüfung und Rechen-/Vertragsprüfungen je Push und Pull Request.
name: Verify

on:
  push:
  pull_request:

# Nur Lesezugriff für das Workflow-Token (Sonar: Security Rating).
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run build
