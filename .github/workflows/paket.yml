# Auslieferungspaket bauen (scripts/paket.mjs) – von Hand gestartet.
# Ergebnis als Artefakt: Serverpaket (tar.gz für server/bin/aufspielen.sh),
# Einzeldatei und Quellcode. Aufgespielt wird weiterhin von Hand auf dem
# Server; der Workflow verändert nichts im Repository.
name: Paket

on:
  workflow_dispatch:
    inputs:
      grundpfad:
        description: "Grundpfad, unter dem der Server ausliefert (muss auf / enden)"
        default: "/Cad_light/"
        required: true

permissions:
  contents: read

jobs:
  paket:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Paket bauen
        env:
          RAVIA_BASE: ${{ inputs.grundpfad }}
          RAVIA_PAKET: ${{ runner.temp }}/auslieferung
        run: npm run paket
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ravia-cad-light-paket
          path: ${{ runner.temp }}/auslieferung/
          retention-days: 30
