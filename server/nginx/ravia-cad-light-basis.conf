# ===========================================================================
#  Gemeinsame Einstellungen der drei /Cad_light/-Locations
# ---------------------------------------------------------------------------
#  Ablegen unter: /etc/nginx/snippets/ravia-cad-light-basis.conf
#
#  Warum eine eigene Datei: nginx **vererbt nicht** in Locations hinein, wenn
#  dort gleichartige Anweisungen stehen — `add_header` verliert alle
#  Kopfzeilen des umgebenden Blocks, sobald eine location eine eigene setzt,
#  und `types` gilt nur dort, wo es steht. Diese Datei wird deshalb in jede
#  der drei Locations eingebunden statt dreimal abgeschrieben.
#
#  Und deshalb steht `types` **nicht** auf Serverebene: dort würde es die
#  MIME-Zuordnung für ganz ravia-tech.de ersetzen, also auch für RaVia
#  Heizlast. Was in dieser Datei nicht aufgeführt ist, käme dann als
#  application/octet-stream.
# ===========================================================================

# -- MIME-Typen -------------------------------------------------------------
#  **Die Zeile, ohne die das PDF-Einlesen stillschweigend ausfällt.**
#  Der Arbeitsprozess von pdf.js heißt `pdf.worker.min-*.mjs`. Die
#  mitgelieferte mime.types der meisten Distributionen kennt `.mjs` nicht und
#  liefert `application/octet-stream`; ein Browser lehnt ein Modul mit diesem
#  Typ ab. Die Anwendung startet dann, aber ein hochgeladenes PDF bleibt ohne
#  Wirkung — und in der Konsole steht eine Meldung, die kein Anwender liest.
#
#  Dasselbe gilt für `.webmanifest`: Mit `application/octet-stream` gilt das
#  Web-App-Manifest bei Chrome als nicht vorhanden, und die Anwendung startet
#  beim Antippen der Kachel im gewöhnlichen Browserfenster statt im eigenen.
#  Der Eintrag gehört **in diese Tabelle** und nicht als zweites `types` in
#  eine einzelne `location`: Dort stünde `default_type` doppelt, und nginx
#  verweigert dann den Start. (Genau so geschehen, vom Test abgefangen.)
types {
    application/manifest+json  webmanifest;
    application/javascript  js mjs;
    text/css                css;
    text/html               html;
    image/svg+xml           svg svgz;
    font/woff2              woff2;
    font/woff               woff;
    application/json        json map;
    image/png               png;
    image/jpeg              jpg jpeg;
    image/webp              webp;
    image/gif               gif;
    image/x-icon            ico;
    application/pdf         pdf;
    text/plain              txt md;
    application/wasm        wasm;
}
default_type application/octet-stream;
charset utf-8;

# -- Kompression ------------------------------------------------------------
#  Ohne sie gehen rund 4,2 MB über die Leitung, mit ihr rund 1,1 MB.
#  Schriften sind bereits komprimiert und bleiben außen vor.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# -- Sicherheitskopfzeilen --------------------------------------------------
#  Sie gelten nur innerhalb von /Cad_light/; der Rest von ravia-tech.de
#  bleibt unberührt.
#
#  script-src 'self' — ohne 'unsafe-inline' und ohne 'unsafe-eval'. Möglich,
#  weil die fünf Druckwege seit 1.14.0 kein eingebettetes Skript mehr
#  schreiben: ein Druckfenster erbt die Richtlinie des Öffners, und mit einem
#  Skript im Dokument ginge der Druckdialog stillschweigend nicht auf.
#
#  style-src braucht 'unsafe-inline' — React setzt Stile als Attribut am
#  Element, und die Druckfenster tragen ihr Blattformat als <style> im
#  Dokument. Ein Stilangriff ist ungleich harmloser als ein Skriptangriff.
#
#  img-src data: für das Symbol im Browserreiter, blob: für den hochgeladenen
#  Grundriss — der bleibt im Browser und geht nie an den Server.
#
#  worker-src für den Arbeitsprozess von pdf.js.
#
#  connect-src 'self' — **die Anwendung ruft nichts nach außen.** Kein
#  Analysedienst, keine Schriften, keine Fehlermeldung nach Hause.
#
#  frame-ancestors 'self' — RaVia und CAD Light liegen auf derselben Domain,
#  eine fremde Herkunft ist deshalb nicht nötig. Jede andere Seite wird
#  abgewiesen; Clickjacking ist damit ausgeschlossen.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' blob:; form-action 'none'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
