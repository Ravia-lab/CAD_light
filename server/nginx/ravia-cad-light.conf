# ===========================================================================
#  RaVia CAD Light 1.14.0 unter https://ravia-tech.de/Cad_light/
# ---------------------------------------------------------------------------
#  Ablegen unter:  /etc/nginx/snippets/ravia-cad-light.conf
#  Einbinden im bestehenden server{}-Block von ravia-tech.de, **eine Zeile**:
#
#      include /etc/nginx/snippets/ravia-cad-light.conf;
#
#  Danach:  nginx -t && systemctl reload nginx
#
# ---------------------------------------------------------------------------
#  WARUM HIER KEIN proxy_pass UND KEIN PORT 8002 STEHT
# ---------------------------------------------------------------------------
#  RaVia Heizlast läuft als Anwendung auf Port 8001, und dafür ist ein
#  `proxy_pass` genau richtig: dort lauscht ein Prozess.
#
#  **CAD Light ist keine Anwendung in diesem Sinne.** Es ist ein Stapel
#  Dateien — HTML, JavaScript, CSS, Schriften. Es gibt keinen Prozess, der
#  lauschen könnte, und damit nichts, wohin ein `proxy_pass` weiterleiten
#  könnte. Ein Port 8002 wäre ein Dienst, den jemand starten, überwachen und
#  nach jedem Neustart wieder hochbringen müsste — für nichts. nginx liefert
#  die Dateien selbst aus, schneller als jeder Proxy davor und ohne einen
#  weiteren Dienst, der ausfallen kann.
#
#  Die ganze Rechnung läuft im Browser des Anwenders. Der Server hält nichts,
#  speichert nichts und rechnet nichts.
#
# ---------------------------------------------------------------------------
#  DER PFAD STECKT IM BUILD, NICHT IN DIESER DATEI
# ---------------------------------------------------------------------------
#  Die ausgelieferte `index.html` verweist absolut auf `/Cad_light/assets/…`.
#  Erzeugt wird sie mit
#
#      RAVIA_BASE=/Cad_light/ npm run build
#
#  Wer den Pfad hier ändert, ohne neu zu bauen, bekommt eine **weiße Seite
#  ohne Fehlermeldung**: der Server antwortet, nur mit der falschen Datei.
#  Kein `rewrite` und kein `try_files` repariert das, weil die falschen
#  Adressen bereits im ausgelieferten HTML stehen.
#
# ---------------------------------------------------------------------------
#  DREI GESCHWISTER, NICHT VERSCHACHTELT
# ---------------------------------------------------------------------------
#  Die drei Locations stehen nebeneinander und nicht ineinander. Grund:
#  `alias` verhält sich in einer **Regex**-Location anders als in einer
#  Prefix-Location — er hängt den Restpfad **nicht** an. Eine verschachtelte
#  `location ~* ^/Cad_light/assets/` mit `alias` liefert deshalb eine 301 auf
#  das Verzeichnis statt der Datei. Nachgemessen, nicht vermutet.
#  Mit `^~` (Prefix, ohne Regexprüfung) hängt nginx den Rest korrekt an.
# ===========================================================================

# -- 1 · Die Dateien mit Inhaltsstempel im Namen -----------------------------
#  Vite gibt jeder Skript-, Stil- und Schriftdatei einen Stempel
#  (index-DCd_Ok-t.js). Ändert sich der Inhalt, ändert sich der Name. Solche
#  Dateien werden nie überschrieben, sondern ersetzt — sie dürfen deshalb ein
#  Jahr lang zwischengespeichert werden.
#
#  `^~` bedeutet: dieser Prefix gewinnt, und es werden keine Regex-Locations
#  mehr geprüft.
location ^~ /Cad_light/assets/ {
    alias /opt/ravia-cad-light/aktuell/assets/;
    include /etc/nginx/snippets/ravia-cad-light-basis.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

# -- 2 · Die Startseite ------------------------------------------------------
#  Sie trägt **keinen** Stempel; sie ist der Zeiger auf die aktuellen Namen.
#  Wird sie zwischengespeichert, sieht der Anwender nach einer Aktualisierung
#  tagelang die alte Fassung — und zwar ohne jede Fehlermeldung. Das ist der
#  häufigste Betriebsfehler bei dieser Bauart.
#
#  `no-store` wäre zu scharf (dann lädt der Browser sie bei jedem Klick neu);
#  `no-cache` heißt „nimm sie aus dem Speicher, aber frag vorher nach, ob sie
#  noch stimmt".
location = /Cad_light/index.html {
    alias /opt/ravia-cad-light/aktuell/index.html;
    include /etc/nginx/snippets/ravia-cad-light-basis.conf;
    add_header Cache-Control "no-cache" always;
}

# -- 3 · Alles Übrige --------------------------------------------------------
#  Das Anwenderhandbuch unter /Cad_light/handbuch.html, die Beispielseite zur
#  Einbettung, und der Rückfall für einen versehentlich aufgerufenen
#  Unterpfad.
location /Cad_light/ {
    alias /opt/ravia-cad-light/aktuell/;
    try_files $uri $uri/ /Cad_light/index.html;
    include /etc/nginx/snippets/ravia-cad-light-basis.conf;
    add_header Cache-Control "no-cache" always;

    # ---------------------------------------------------------------------
    #  ZUGANG AN DEN LOGIN KNÜPFEN — hier, wenn gewünscht
    # ---------------------------------------------------------------------
    #  Die drei Zeilen prüfen bei **jedem** Aufruf gegen einen Endpunkt der
    #  RaVia-Anwendung, ob die Sitzung gültig ist. Weil beides auf derselben
    #  Domain liegt, geht das Sitzungs-Cookie automatisch mit; es ist keine
    #  Cookie-Anpassung und keine Cross-Domain-Behandlung nötig.
    #
    #  Voraussetzung: RaVia muss einen Endpunkt anbieten, der **204** (oder
    #  200) für eine gültige Sitzung und **401/403** sonst antwortet — ohne
    #  Rumpf und ohne Umleitung. Diesen Endpunkt gibt es noch nicht; solange
    #  er fehlt, bleiben die Zeilen auskommentiert.
    #
    #  Wichtig: die Prüfung gehört **nicht** an die Locations 1 und 2. Ein
    #  Rechteprüflauf je Skriptdatei kostet bei jedem Seitenaufruf ein
    #  Dutzend zusätzliche Anfragen an die Anwendung. Wer den Einstieg
    #  schützt, schützt die Anwendung; die Dateien darunter sind ohne die
    #  Startseite ohnehin nutzlos.
    #
    # auth_request      /__ravia_auth;
    # auth_request_set  $auth_user $upstream_http_x_ravia_user;
    # error_page 401 403 = @ravia_login;
}

# Der Prüfendpunkt und die Umleitung zum Login — beides gehört zur
# auth_request-Variante oben und bleibt mit ihr auskommentiert.
#
# location = /__ravia_auth {
#     internal;
#     proxy_pass              http://127.0.0.1:8001/api/session/pruefen;
#     proxy_pass_request_body off;
#     proxy_set_header        Content-Length "";
#     proxy_set_header        X-Original-URI $request_uri;
# }
#
# location @ravia_login {
#     return 302 /login?weiter=$request_uri;
# }

# -- 4 · Der Aufruf ohne abschließenden Schrägstrich ------------------------
#  `…/Cad_light` sucht nginx als **Datei**, nicht als Verzeichnis. Ohne diese
#  Umleitung bekäme der erste Anwender, der die Adresse aus dem Gedächtnis
#  tippt, eine 404.
location = /Cad_light {
    return 301 /Cad_light/;
}
