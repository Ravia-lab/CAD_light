# ===========================================================================
#  RaVia CAD Light 1.14.0 — nginx-Serverblock
# ===========================================================================
#
#  ANPASSEN — drei Stellen in dieser Datei, alle mit >>> ANPASSEN <<<:
#
#    1. server_name          die Adresse, unter der die Anwendung läuft
#                            (zweimal: im http- und im https-Block)
#    2. ssl_certificate      die beiden Zertifikatspfade (setzt certbot)
#    3. root                 nur, wenn Sie ein anderes Verzeichnis wollen
#
#  Die vierte Anpassung — **die Adresse von RaVia für die Einbettung** —
#  steht nicht hier, sondern in `ravia-cad-kopfzeilen.conf` bei
#  `frame-ancestors`. Sie ist dort die einzige wirksame Stelle.
#
#  Alles andere ist begründet und sollte so bleiben. Wo eine Zeile fehlt oder
#  falsch ist, äußert sich das nicht als Fehlermeldung, sondern als Anwendung,
#  die aussieht, als würde sie laufen. Die drei Stellen, an denen das
#  erfahrungsgemäß passiert, sind unten ausdrücklich kommentiert:
#  der MIME-Typ für .mjs, die Zwischenspeicherregel für index.html und
#  frame-ancestors.
#
#  Ablegen unter:  /etc/nginx/sites-available/ravia-cad.conf
#  Verknüpfen:     ln -s ../sites-available/ravia-cad.conf /etc/nginx/sites-enabled/
#  Prüfen:         nginx -t
#  Übernehmen:     systemctl reload nginx
# ===========================================================================

# ---------------------------------------------------------------------------
#  Zwischenspeicherung nach Dateiart.
#
#  Der Kniff, auf dem der ganze Betrieb ruht: Vite gibt jeder Skript- und
#  Stildatei einen **Inhaltsstempel** im Namen (index-BWs9MYVy.js). Ändert
#  sich der Inhalt, ändert sich der Name. Solche Dateien dürfen deshalb ein
#  Jahr lang zwischengespeichert werden — sie werden nie überschrieben,
#  sondern ersetzt.
#
#  Die index.html trägt **keinen** Stempel; sie ist der Zeiger auf die
#  aktuellen Namen. Wird sie zwischengespeichert, sieht der Anwender nach
#  einer Aktualisierung noch tagelang die alte Fassung — und zwar ohne jede
#  Fehlermeldung. Das ist der häufigste Betriebsfehler bei dieser Bauart.
# ---------------------------------------------------------------------------
map $uri $ravia_cache {
    default                 "no-cache";
    ~^/assets/              "public, max-age=31536000, immutable";
    ~*\.(woff2?|ttf|otf)$   "public, max-age=31536000, immutable";
}

# ---------------------------------------------------------------------------
#  http → https. Ausgenommen bleibt nur der Pfad, über den Let's Encrypt
#  seine Prüfung ablegt; ohne diese Ausnahme lässt sich das Zertifikat
#  nicht erneuern.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name cad.ravia.de;                       # >>> ANPASSEN <<<

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2 — die Schreibweise hängt an der nginx-Fassung, und die falsche
    # lässt den Server gar nicht erst starten:
    #   ab 1.25.1:   http2 on;              (eigene Anweisung, hier einfügen)
    #   bis 1.24:    listen 443 ssl http2;  (an die beiden Zeilen darüber)
    # `bin/einrichten.sh` setzt die passende Form selbst ein; wer von Hand
    # arbeitet, prüft vorher `nginx -v`.
    http2 on;
    server_name cad.ravia.de;                       # >>> ANPASSEN <<<

    # -- Zertifikat ---------------------------------------------------------
    #  Setzt certbot beim ersten Lauf selbst ein. Siehe Handbuch, Schritt 5.
    ssl_certificate     /etc/letsencrypt/live/cad.ravia.de/fullchain.pem;   # >>> ANPASSEN <<<
    ssl_certificate_key /etc/letsencrypt/live/cad.ravia.de/privkey.pem;     # >>> ANPASSEN <<<
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # -- Wo die Dateien liegen ----------------------------------------------
    #  `aktuell` ist eine Verknüpfung auf die laufende Fassung. Das
    #  Aufspielskript legt die neue daneben und schaltet die Verknüpfung um —
    #  dadurch gibt es keinen Zeitpunkt, an dem halb alte und halb neue
    #  Dateien ausgeliefert werden.
    root /var/www/ravia-cad/aktuell;                # >>> ANPASSEN, falls anders <<<
    index index.html;

    # `charset` ohne diese Zeile: nginx liefert HTML ohne Zeichensatzangabe
    # aus. Die Anwendung setzt ihn selbst im Dokument, die Druckfenster aber
    # werden zur Laufzeit erzeugt — dort entscheidet der Serverwert.
    charset utf-8;
    charset_types text/css text/plain application/javascript application/json image/svg+xml;

    # -- MIME-Typen ---------------------------------------------------------
    #  **Die Zeile, ohne die das PDF-Einlesen stillschweigend ausfällt.**
    #  Der Arbeitsprozess von pdf.js heißt `pdf.worker.min-*.mjs`. Die
    #  mitgelieferte mime.types der meisten Distributionen kennt `.mjs`
    #  nicht und liefert `application/octet-stream`. Ein Browser lehnt ein
    #  Modul mit diesem Typ ab — die Anwendung startet, das Hochladen eines
    #  PDF bleibt aber ohne Wirkung, und in der Konsole steht eine Meldung,
    #  die kein Anwender liest.
    # ACHTUNG: dieser Block **ersetzt** die MIME-Zuordnung für diesen
    # Serverblock vollständig; die mime.types der Distribution gilt hier
    # nicht mehr. Wer später eine Dateiart ergänzt, muss sie hier eintragen —
    # sonst kommt sie als application/octet-stream und der Browser lehnt sie
    # ab oder bietet sie zum Herunterladen an.
    types {
        application/javascript  mjs js;
        text/css                css;
        text/html               html;
        image/svg+xml           svg svgz;
        font/woff2              woff2;
        font/woff               woff;
        application/json        json;
        image/png               png;
        image/jpeg              jpg jpeg;
        application/wasm        wasm;
        image/webp              webp;
        image/gif               gif;
        image/x-icon            ico;
        text/plain              txt md;
        application/json        map;
        application/pdf         pdf;
        text/xml                xml;
    }
    default_type application/octet-stream;

    # -- Kompression --------------------------------------------------------
    #  Die Anwendung ist zum größten Teil Text. Ohne Kompression gehen rund
    #  4,2 MB über die Leitung, mit rund 1,1 MB. Schriften sind bereits
    #  komprimiert und bleiben außen vor.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml;

    # Wenn `ngx_brotli` gebaut ist, bringt es noch einmal rund 15 %.
    # Die beiden Zeilen sind absichtlich auskommentiert: ohne das Modul
    # startet nginx mit ihnen **nicht**, und ein Server, der nach dem
    # Aufspielen nicht mehr hochkommt, ist der schlechtere Tausch.
    # brotli on;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # -- Sicherheitskopfzeilen ----------------------------------------------
    include /etc/nginx/snippets/ravia-cad-kopfzeilen.conf;

    # -- Auslieferung -------------------------------------------------------
    location / {
        # Die Anwendung hat keine Serverpfade — sie ist eine einzige Seite.
        # Der Rückfall auf index.html sorgt dafür, dass ein versehentlich
        # aufgerufener Unterpfad die Anwendung zeigt statt einer 404.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control $ravia_cache always;
        include /etc/nginx/snippets/ravia-cad-kopfzeilen.conf;
    }

    # Die index.html ausdrücklich noch einmal: sie darf **nie** aus dem
    # Zwischenspeicher kommen. `no-store` wäre zu scharf (dann lädt der
    # Browser sie bei jedem Klick neu); `no-cache` heißt „nimm sie aus dem
    # Speicher, aber frag vorher nach, ob sie noch stimmt".
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/ravia-cad-kopfzeilen.conf;
    }

    # Die Beispielseite zur Einbettung. Sie zeigt, wie RaVia die Anwendung
    # einbindet, und ist bewusst erreichbar — wer die Einbettung baut,
    # braucht sie zum Vergleich.
    location = /einbettung-beispiel.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/ravia-cad-kopfzeilen.conf;
    }

    # -- Zugriffsschutz -----------------------------------------------------
    #  Versteckte Dateien und Sicherungskopien gehen niemanden etwas an.
    location ~ /\. { deny all; }
    location ~ ~$  { deny all; }

    # -- Protokoll ----------------------------------------------------------
    access_log /var/log/nginx/ravia-cad.access.log;
    error_log  /var/log/nginx/ravia-cad.error.log warn;

    # Ein Grundriss aus einem großen PDF kann als Projektdatei zurückkommen;
    # hochgeladen wird zwar nichts an den Server, aber die Grenze schadet
    # nicht und verhindert, dass ein Fehlgriff das Protokoll flutet.
    client_max_body_size 4m;
}
