# ===========================================================================
#  Sicherheitskopfzeilen für RaVia CAD Light
# ---------------------------------------------------------------------------
#  Ablegen unter: /etc/nginx/snippets/ravia-cad-kopfzeilen.conf
#
#  Warum eine eigene Datei: `add_header` in nginx **erbt nicht**. Sobald ein
#  `location`-Block eine eigene Kopfzeile setzt, verliert er alle Kopfzeilen
#  des `server`-Blocks. Deshalb wird diese Datei in jedem Block eingebunden,
#  der `add_header` benutzt — und deshalb steht sie hier einmal statt
#  viermal.
# ===========================================================================

# ---------------------------------------------------------------------------
#  Inhaltsrichtlinie (Content-Security-Policy)
# ---------------------------------------------------------------------------
#  Sie sagt dem Browser, woher die Seite überhaupt etwas laden darf. Jede
#  Zeile hat einen Grund; die drei, an denen erfahrungsgemäß etwas kaputtgeht,
#  sind einzeln erklärt.
#
#  script-src 'self'
#      Nur eigene Skripte, kein `unsafe-inline`, kein `unsafe-eval`. Das ist
#      seit 1.14.0 möglich, weil die fünf Druckwege ihr eingebettetes Skript
#      losgeworden sind: der Druck wird vom Hauptfenster ausgelöst statt aus
#      dem Druckfenster heraus. Ein Druckfenster erbt die Richtlinie des
#      Öffners — mit einem eingebetteten Skript ginge der Druckdialog hier
#      **stillschweigend nicht auf**.
#
#  style-src 'self' 'unsafe-inline'
#      Nötig, und zwar nicht aus Bequemlichkeit: React setzt Stile als
#      Attribut am Element (`style={{…}}`), und die Druckfenster tragen ihr
#      Blattformat als `<style>` im Dokument. Beides fällt unter
#      `unsafe-inline`. Ein Stilangriff ist ungleich harmloser als ein
#      Skriptangriff, und `script-src` bleibt streng.
#
#  img-src 'self' data: blob:
#      `data:` für das Symbol im Browserreiter und die eingebetteten Bilder
#      der Ausdrucke, `blob:` für den hochgeladenen Grundriss — der wird im
#      Browser gehalten und nie an den Server geschickt.
#
#  worker-src 'self' blob:
#      Der Arbeitsprozess von pdf.js. `blob:` ist der Rückfallweg, den
#      pdf.js selbst wählt, wenn es seine Datei nicht laden kann.
#
#  connect-src 'self'
#      **Die Anwendung ruft nichts nach außen.** Kein Analysedienst, keine
#      Schriften, keine Karten, keine Fehlermeldung nach Hause. Diese Zeile
#      hält es so; wer eine Gegenstelle ergänzt, muss sie hier eintragen und
#      merkt dabei, dass er es tut.
#
#  frame-ancestors 'self' https://app.ravia.de
#      **Wer die Seite in einen Rahmen stellen darf.** `'self'` erlaubt den
#      unmittelbaren Aufruf unter der eigenen Adresse, die zweite Angabe
#      erlaubt RaVia die Einbettung. Jede andere Seite wird abgewiesen —
#      damit ist Clickjacking ausgeschlossen.
#
#      Soll die Anwendung **ausschließlich** aus RaVia heraus erreichbar sein
#      und nicht mehr unmittelbar: `'self'` streichen. Dann bleibt der
#      Aufruf der Adresse im Browser leer. Das ist eine bewusste Entscheidung
#      und keine Kleinigkeit — auch die Beispielseite zur Einbettung und der
#      Aufruf zur Fehlersuche funktionieren dann nicht mehr.
#      >>> ANPASSEN: die RaVia-Adresse <<<
#      **Und zwar hier, in dieser Datei.** Das ist die einzige Stelle, an der
#      die Adresse steht und wirkt. Bis 1.14.0 stand im Serverblock zusätzlich
#      eine Variable `$ravia_origin`, die zwar gesetzt, aber von keiner
#      Anweisung ausgewertet wurde — wer nur sie änderte, bekam weiter einen
#      leeren Rahmen und keinen Hinweis darauf, warum. Die Variable ist
#      entfernt.
#
#  form-action 'none'
#      Die Anwendung hat kein einziges Formular, das absendet. Alles bleibt
#      im Browser.
#
#  base-uri 'self' / object-src 'none'
#      Zwei alte Einfallstore, die nichts kosten, wenn man sie schließt.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' blob:; form-action 'none'; frame-ancestors 'self' https://app.ravia.de; upgrade-insecure-requests" always;

# ---------------------------------------------------------------------------
#  Die übrigen Kopfzeilen
# ---------------------------------------------------------------------------

# Kein Erraten des Dateityps. Ohne diese Zeile darf der Browser eine Datei
# anders deuten, als der Server sie ausgibt — genau der Weg, über den ein
# hochgeladenes Bild zu einem Skript wird.
add_header X-Content-Type-Options "nosniff" always;

# Wohin die Adresse der Seite weitergegeben wird, wenn jemand einem Verweis
# folgt. `strict-origin-when-cross-origin` gibt an fremde Seiten nur noch die
# Herkunft weiter, nicht den vollen Pfad.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Der alte Rahmenschutz. Er wird von `frame-ancestors` fachlich abgelöst,
# aber ältere Browser kennen nur ihn. `SAMEORIGIN` statt `DENY`, weil sonst
# die Einbettung in RaVia dort scheitern würde.
add_header X-Frame-Options "SAMEORIGIN" always;

# Was die Seite an Gerätefunktionen **nicht** benutzt. Die Anwendung braucht
# keine davon; sie ausdrücklich abzuschalten heißt, dass ein eingeschleustes
# Skript sie auch nicht bekommt.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# HSTS — der Browser merkt sich, dass diese Adresse nur über TLS zu erreichen
# ist, und ruft sie beim nächsten Mal gar nicht erst unverschlüsselt auf.
#
# ACHTUNG, und deshalb steht die Zeile hier auskommentiert: die Angabe gilt
# ein Jahr und lässt sich **nicht zurücknehmen** — auch nicht durch
# Abschalten der Zeile. Erst einschalten, wenn TLS steht und die Erneuerung
# nachweislich läuft. `includeSubDomains` nur, wenn wirklich **alle**
# Unteradressen dieser Domain TLS können.
# add_header Strict-Transport-Security "max-age=31536000" always;

# Die nginx-Fassung im Antwortkopf sagt einem Angreifer, welche Lücken er
# probieren kann. Sie gehört in `nginx.conf` (Abschnitt `http`), steht hier
# aber als Erinnerung: server_tokens off;
