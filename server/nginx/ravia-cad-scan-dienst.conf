# ===========================================================================
#  „Mit RaVia Scan scannen" — Weiterleitung zum Scan-Dienst (seit 1.74.0)
# ---------------------------------------------------------------------------
#  Einfügen in /etc/nginx/snippets/ravia-cad-light.conf (ravia-tech.de) und
#  ravia-cad-light-test.conf (test.ravia-tech.de), VOR den übrigen
#  /Cad_light/-Locations. Danach: nginx -t && systemctl reload nginx.
#
#  Warum eine Weiterleitung statt einer Adresse im Browser: Die Anwendung
#  spricht nur mit dem eigenen Server (connect-src 'self'), und das bleibt
#  so. Der Scan-Dienst ist der Relay der RaVia-Testumgebung
#  (/api/scan/v1/relay, Schalter RAVIA_SCAN_RELAY_AKTIV) — siehe Auftrag an
#  RaVia „scan-relay". Cookies gehen nicht mit: Der Relay kennt keine
#  Anmeldung, berechtigt ist, wer das Lesetoken hat.
#
#  Fehlt dieser Block, antwortet /Cad_light/scan-dienst/ mit der 404-Seite,
#  und der Dialog sagt „noch nicht eingerichtet" — es geht nichts kaputt.
# ===========================================================================
location /Cad_light/scan-dienst/ {
    proxy_pass http://127.0.0.1:8001/api/scan/v1/relay/;
    proxy_set_header Host test.ravia-tech.de;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie "";
    client_max_body_size 64k;
    add_header Cache-Control "no-store" always;
}
